<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ja echt</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    #canvas-container canvas {
      width: 100% !important;
      height: 100% !important;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
    }
    .ui-layer {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    h1 {
      font-size: clamp(3.5rem, 12vw, 7.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #ffffff;
      text-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
      transition: transform 0.2s ease;
      cursor: pointer;
      pointer-events: auto;
    }
    h1:hover {
      transform: scale(1.04);
    }
    h1:active {
      transform: scale(0.96);
    }
    .counter {
      position: absolute;
      bottom: 2rem;
      pointer-events: auto;
      opacity: 0.8;
      transition: opacity 0.2s, transform 0.2s;
    }
    .counter:hover {
      opacity: 1;
      transform: translateY(-2px);
    }
    .tool-link {
      margin-top: 1.5rem;
      pointer-events: auto;
      color: rgba(255, 255, 255, 0.85);
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      text-decoration: none;
      letter-spacing: -0.01em;
      transition: all 0.2s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .tool-link:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.16);
      border-color: rgba(255, 255, 255, 0.45);
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.6);
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <main class="ui-layer">
    <h1 id="title">ja echt</h1>
    <a href="https://mason363.github.io/NumPlay/customize/#games=numdrive%2Ccrossyroad%2Cblockblast%2Csuika%2Ctetris%2Cbreakout%2Cg2048%2Cconnectfour%2Csudoku%2Cflappybird%2Ctwoplayer%2Cchess%2Cflappydunk%2Cdinorun%2Csnake%2Cuttt%2Ctombofthemask%2Cstickmanhook%2Cuno%2Cnumblocks%2Cnumdash%2Cpacman%2Cdonkeykong&space=e26" target="_blank" rel="noopener noreferrer" class="tool-link">
      spellen rekenmachine
    </a>
    <div class="counter" id="counter-box"></div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // --- 3D Low-Res Low-Poly Scene Setup ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0d1117, 0.025);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 25;

    const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
    
    // Low-resolution rendering factor (chunky pixelated PS1 look)
    const pixelScale = 0.32;
    function updateRendererSize() {
      renderer.setSize(Math.floor(window.innerWidth * pixelScale), Math.floor(window.innerHeight * pixelScale), false);
    }
    updateRendererSize();
    renderer.setPixelRatio(1);
    container.appendChild(renderer.domElement);

    // Strakke belichting voor witte facetten
    const ambientLight = new THREE.AmbientLight(0x2d333b, 1.4);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.4);
    keyLight.position.set(20, 25, 20);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x768390, 1.2);
    fillLight.position.set(-20, -15, -10);
    scene.add(fillLight);

    // Alle kubussen 100% wit met flat shading
    const whiteMaterial = new THREE.MeshStandardMaterial({
      color: 0xffffff,
      flatShading: true,
      roughness: 0.25,
      metalness: 0.05
    });

    const cubes = [];
    const cubeCount = 38;

    for (let i = 0; i < cubeCount; i++) {
      const size = Math.random() * 2.2 + 0.8;
      const geometry = new THREE.BoxGeometry(size, size, size);
      const mesh = new THREE.Mesh(geometry, whiteMaterial);
      
      const x = (Math.random() - 0.5) * 50;
      const y = (Math.random() - 0.5) * 35;
      const z = (Math.random() - 0.5) * 35;
      mesh.position.set(x, y, z);

      mesh.rotation.x = Math.random() * Math.PI;
      mesh.rotation.y = Math.random() * Math.PI;

      cubes.push({
        mesh: mesh,
        baseX: x,
        baseY: y,
        baseZ: z,
        rotSpeedX: (Math.random() - 0.5) * 0.015,
        rotSpeedY: (Math.random() - 0.5) * 0.015,
        rotSpeedZ: (Math.random() - 0.5) * 0.015,
        floatSpeed: Math.random() * 0.0015 + 0.001,
        floatOffset: Math.random() * Math.PI * 2,
        floatDist: Math.random() * 2 + 1
      });

      scene.add(mesh);
    }

    // Muis parallax
    let mouseX = 0;
    let mouseY = 0;
    let targetX = 0;
    let targetY = 0;

    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX - window.innerWidth / 2) * 0.0015;
      mouseY = (e.clientY - window.innerHeight / 2) * 0.0015;
    });

    // Klik interactie
    window.addEventListener('click', () => {
      cubes.forEach(c => {
        c.rotSpeedX += (Math.random() - 0.5) * 0.08;
        c.rotSpeedY += (Math.random() - 0.5) * 0.08;
      });
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      updateRendererSize();
    });

    // Animatie
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      targetX += (mouseX - targetX) * 0.05;
      targetY += (mouseY - targetY) * 0.05;
      camera.position.x = targetX * 15;
      camera.position.y = -targetY * 15;
      camera.lookAt(0, 0, 0);

      cubes.forEach(c => {
        c.mesh.rotation.x += c.rotSpeedX;
        c.mesh.rotation.y += c.rotSpeedY;
        c.mesh.rotation.z += c.rotSpeedZ;

        c.rotSpeedX *= 0.99;
        c.rotSpeedY *= 0.99;

        c.mesh.position.y = c.baseY + Math.sin(elapsedTime * c.floatSpeed * 1000 + c.floatOffset) * c.floatDist;
      });

      renderer.render(scene, camera);
    }

    animate();

    // --- Anti-Spam Bezoekersteller ---
    (function initCounter() {
      const counterBox = document.getElementById('counter-box');
      const LAST_VISIT_KEY = 'jaditis_last_visit_timestamp';
      const COOLDOWN_MS = 12 * 60 * 60 * 1000; // 12 uur bescherming tegen spam refreshes
      
      const now = Date.now();
      const lastVisit = localStorage.getItem(LAST_VISIT_KEY);
      const isNewVisitor = !lastVisit || (now - parseInt(lastVisit, 10)) > COOLDOWN_MS;

      const img = document.createElement('img');
      img.alt = 'bezoekers';

      if (isNewVisitor) {
        // Uniek nieuw bezoek: verhoog live teller
        localStorage.setItem(LAST_VISIT_KEY, now.toString());
        img.src = 'https://hits.sh/jaditismijnwebsite.nl-uniek.svg?label=bezoekers&color=ffffff&labelColor=21262d&t=' + now;
      } else {
        // Bezoeker refresht alleen: haal gecachte versie via CDN op (telt NIET op)
        img.src = 'https://images.weserv.nl/?url=hits.sh/jaditismijnwebsite.nl-uniek.svg?label=bezoekers&color=ffffff&labelColor=21262d';
      }

      counterBox.appendChild(img);
    })();
  </script>
</body>
</html>
