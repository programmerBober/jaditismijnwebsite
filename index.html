<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ja echt</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d1117;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }
    .ui-layer {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    h1 {
      font-size: clamp(3.5rem, 12vw, 7.5rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      color: #ffffff;
      text-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
      transition: transform 0.2s ease;
      cursor: pointer;
      pointer-events: auto;
    }
    h1:hover {
      transform: scale(1.04);
    }
    h1:active {
      transform: scale(0.96);
    }
    .counter {
      position: absolute;
      bottom: 2rem;
      pointer-events: auto;
      opacity: 0.75;
      transition: opacity 0.2s, transform 0.2s;
    }
    .counter:hover {
      opacity: 1;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>

  <main class="ui-layer">
    <h1 id="title">ja echt</h1>
    <div class="counter">
      <img src="https://hits.sh/jaditismijnwebsite.nl.svg?label=bezoekers&color=238636&labelColor=21262d" alt="bezoekers">
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x0d1117, 0.025);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 25;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // Verlichting voor scherpe low-poly facetten
    const ambientLight = new THREE.AmbientLight(0x22272e, 1.5);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffaa55, 2.2); // Gouden/oranje gloed
    sunLight.position.set(20, 25, 20);
    scene.add(sunLight);

    const coolLight = new THREE.DirectionalLight(0x4488ff, 1.8); // Koele blauwe tegenkleur
    coolLight.position.set(-20, -15, -10);
    scene.add(coolLight);

    // Kleurenpalet voor de kubussen (low-poly kleuring)
    const palette = [0x2f363d, 0x444d56, 0x586069, 0x1f6feb, 0xf0883e, 0x2ea043];

    const cubes = [];
    const cubeCount = 35;

    for (let i = 0; i < cubeCount; i++) {
      const size = Math.random() * 2.2 + 0.8;
      const geometry = new THREE.BoxGeometry(size, size, size);
      
      const color = palette[Math.floor(Math.random() * palette.length)];
      const material = new THREE.MeshStandardMaterial({
        color: color,
        flatShading: true,
        roughness: 0.35,
        metalness: 0.1
      });

      const mesh = new THREE.Mesh(geometry, material);
      
      const x = (Math.random() - 0.5) * 50;
      const y = (Math.random() - 0.5) * 35;
      const z = (Math.random() - 0.5) * 35;
      mesh.position.set(x, y, z);

      mesh.rotation.x = Math.random() * Math.PI;
      mesh.rotation.y = Math.random() * Math.PI;

      cubes.push({
        mesh: mesh,
        baseX: x,
        baseY: y,
        baseZ: z,
        rotSpeedX: (Math.random() - 0.5) * 0.015,
        rotSpeedY: (Math.random() - 0.5) * 0.015,
        rotSpeedZ: (Math.random() - 0.5) * 0.015,
        floatSpeed: Math.random() * 0.0015 + 0.001,
        floatOffset: Math.random() * Math.PI * 2,
        floatDist: Math.random() * 2 + 1
      });

      scene.add(mesh);
    }

    // Muis parallax tracking
    let mouseX = 0;
    let mouseY = 0;
    let targetX = 0;
    let targetY = 0;

    window.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX - window.innerWidth / 2) * 0.0015;
      mouseY = (e.clientY - window.innerHeight / 2) * 0.0015;
    });

    // Klik boost: geef alle kubussen even een extra spin
    window.addEventListener('click', () => {
      cubes.forEach(c => {
        c.rotSpeedX += (Math.random() - 0.5) * 0.08;
        c.rotSpeedY += (Math.random() - 0.5) * 0.08;
      });
    });

    // Resize handling
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animatie lus
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const elapsedTime = clock.getElapsedTime();

      // Vloeiende camera parallax
      targetX += (mouseX - targetX) * 0.05;
      targetY += (mouseY - targetY) * 0.05;
      camera.position.x = targetX * 15;
      camera.position.y = -targetY * 15;
      camera.lookAt(0, 0, 0);

      // Kubussen laten zweven en draaien
      cubes.forEach(c => {
        c.mesh.rotation.x += c.rotSpeedX;
        c.mesh.rotation.y += c.rotSpeedY;
        c.mesh.rotation.z += c.rotSpeedZ;

        // Rustig terugbrengen naar normale snelheid na klik
        c.rotSpeedX *= 0.99;
        c.rotSpeedY *= 0.99;

        // Zweven
        c.mesh.position.y = c.baseY + Math.sin(elapsedTime * c.floatSpeed * 1000 + c.floatOffset) * c.floatDist;
      });

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
